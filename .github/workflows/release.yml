# Push a tag like v0.2.0 to build a universal Glance.app and publish it as a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the build number (commit count)

      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh

      - name: Zip
        run: ditto -c -k --keepParent build/Glance.app "build/Glance-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Glance-${GITHUB_REF_NAME}.zip" \
            --title "Glance ${GITHUB_REF_NAME}" \
            --generate-notes
