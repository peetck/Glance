# Push a tag like v0.3.0 to build a universal Glance.app, package it as a .dmg, and publish
# it as a GitHub Release. The in-app updater downloads this .dmg, so keep the asset name.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the build number (commit count)

      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh

      - name: Package disk image
        run: ./scripts/dmg.sh "build/Glance-${GITHUB_REF_NAME}.dmg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Glance-${GITHUB_REF_NAME}.dmg" \
            --title "Glance ${GITHUB_REF_NAME}" \
            --generate-notes
