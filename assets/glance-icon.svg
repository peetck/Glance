<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f5c"/>
      <stop offset="1" stop-color="#0e1129"/>
    </linearGradient>
    <radialGradient id="face" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#ffe95c"/>
      <stop offset="0.55" stop-color="#fdd335"/>
      <stop offset="1" stop-color="#f4a51c"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.55" stop-color="#f08c00" stop-opacity="0"/>
      <stop offset="1" stop-color="#e57c00" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="eyeShade" cx="0.45" cy="0.35" r="0.7">
      <stop offset="0.7" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e3ea"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8a4b00" flood-opacity="0.35"/>
    </filter>
    <clipPath id="faceClip">
      <path id="blob" d="M 520 196
        C 712 188, 846 330, 836 530
        C 828 722, 700 858, 498 850
        C 312 843, 186 722, 192 520
        C 198 338, 330 204, 520 196 Z"/>
    </clipPath>
  </defs>

  <!-- macOS-style squircle tile -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <!-- faint price grid, the "market" behind the face -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="4">
    <line x1="100" y1="300" x2="924" y2="300"/>
    <line x1="100" y1="500" x2="924" y2="500"/>
    <line x1="100" y1="700" x2="924" y2="700"/>
  </g>

  <!-- distorted, slightly squashed emoji face -->
  <g filter="url(#drop)" transform="rotate(-6 512 520)">
    <path d="M 520 196 C 712 188, 846 330, 836 530 C 828 722, 700 858, 498 850 C 312 843, 186 722, 192 520 C 198 338, 330 204, 520 196 Z" fill="url(#face)"/>
    <g clip-path="url(#faceClip)">
      <path d="M 520 196 C 712 188, 846 330, 836 530 C 828 722, 700 858, 498 850 C 312 843, 186 722, 192 520 C 198 338, 330 204, 520 196 Z" fill="url(#rim)"/>
      <!-- top sheen -->
      <ellipse cx="450" cy="285" rx="190" ry="60" fill="#fff6b0" opacity="0.45"/>
    </g>

    <!-- lopsided eyes: left smaller, right bigger -->
    <g filter="url(#soft)">
      <ellipse cx="392" cy="452" rx="104" ry="124" transform="rotate(-10 392 452)" fill="url(#eyeShade)"/>
      <ellipse cx="648" cy="430" rx="128" ry="146" transform="rotate(8 648 430)" fill="url(#eyeShade)"/>
    </g>
    <!-- pupils glancing up-right, toward the menu bar -->
    <ellipse cx="438" cy="402" rx="44" ry="58" transform="rotate(-10 438 402)" fill="#3a2410"/>
    <ellipse cx="708" cy="372" rx="50" ry="64" transform="rotate(8 708 372)" fill="#3a2410"/>
    <ellipse cx="424" cy="384" rx="14" ry="20" transform="rotate(-25 424 384)" fill="#a8763f" opacity="0.9"/>
    <ellipse cx="692" cy="352" rx="16" ry="22" transform="rotate(-20 692 352)" fill="#a8763f" opacity="0.9"/>

    <!-- mouth: a little price chart that ends on an uptick -->
    <polyline points="400,690 450,712 498,672 540,700 586,654 626,668"
      fill="none" stroke="#3a2410" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>
